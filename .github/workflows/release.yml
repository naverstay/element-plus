name: Build & Release element-plus latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js + pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install -g pnpm@9.5.0
          pnpm install

      # 3. Build project
      - name: Build project
        run: pnpm build

      # 4. Generate minimal package.json in dist
      - name: Generate minimal package.publish.json
        run: |
          node generate-package-publish.js

      # 5. Create tgz with only dist using git archive
      - name: Create dist-only tgz
        run: |
          # Создаём временную ветку с dist
          git checkout -b release-temp
          git add dist/package.json dist/**/*.js dist/**/*.css
          git commit -m "Prepare dist for release" || echo "Nothing to commit"
          git archive --format=tar.gz --prefix=naverstay-element-plus/ -o dist/naverstay-element-plus-latest.tgz HEAD dist
          echo "TGZ created at dist/naverstay-element-plus-latest.tgz"

      # 6. Create or update tag main-latest
      - name: Create or update tag main-latest
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag -f main-latest
          git push origin main-latest --force
          echo "TAG_NAME=main-latest" >> $GITHUB_ENV

      # 7. Publish latest release to GitHub
      - name: Publish latest release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naverstay-element-plus-latest.tgz
          name: naverstay-element-plus-latest.tgz
          tag_name: ${{ env.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
