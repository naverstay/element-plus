name: Build & Release element-plus fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js + pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install -g pnpm@9.5.0
          pnpm install

      # 3. Сборка проекта
      - name: Build project
        run: pnpm build

      # 4. Определяем версию из package.json и создаём package.json в dist
      - name: Determine package version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using package version: $VERSION"
          jq --arg ver "$VERSION" '.version=$ver' package.publish.json > dist/package.json

      # 5. Пакуем dist в tgz
      - name: Pack dist
        run: |
          cd dist
          npm pack
          ARCHIVE=$(ls *.tgz)
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      # 6. Копируем архив для latest
      - name: Copy archive as latest
        run: |
          cp dist/$ARCHIVE dist/naverstay-element-plus-latest.tgz

      # 7. Загружаем версионный архив
      - name: Upload versioned tgz
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. Загружаем latest
      - name: Upload latest tgz
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naverstay-element-plus-latest.tgz
          name: naverstay-element-plus-latest.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
