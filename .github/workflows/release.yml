name: Upload element-plus tgz to GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout репозитория
      - uses: actions/checkout@v4

      # 2. Определяем версию из тега
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Determined version: $VERSION"

      # 3. Загружаем готовый tgz из папки release-artifacts (или dist)
      #    Например, предположим, что tgz лежит в dist/
      - name: Upload versioned tgz
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naverstay-element-plus-$VERSION.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Создаём копию для latest
      - name: Upload latest tgz
        run: |
          cp dist/naverstay-element-plus-$VERSION.tgz dist/naverstay-element-plus-latest.tgz
        # Загружаем latest
      - name: Upload latest tgz to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naverstay-element-plus-latest.tgz
          name: naverstay-element-plus-latest.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
