name: Build & Release element-plus fork

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js + pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install -g pnpm gh
          pnpm install

      # 3. Сборка проекта
      - name: Build project
        run: pnpm build

      # 4. Определяем версию и создаём package.json в dist
      - name: Determine package version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using package version: $VERSION"
          jq --arg ver "$VERSION" '.version=$ver' package.publish.json > dist/package.json

      # 5. Пакуем dist в tgz
      - name: Pack dist
        run: |
          cd dist
          npm pack
          ARCHIVE=$(ls *.tgz)
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      # 6. Копируем архив для latest
      - name: Copy archive as latest
        run: |
          cp dist/$ARCHIVE dist/naverstay-element-plus-latest.tgz

      # 7. Создаём релиз, если его ещё нет
      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$VERSION"
          RELEASE_EXISTS=$(gh release view $TAG_NAME --repo $GITHUB_REPOSITORY --json id 2>/dev/null || echo "")
          if [ -z "$RELEASE_EXISTS" ]; then
            gh release create $TAG_NAME --title "Release $TAG_NAME" --notes "Auto release $TAG_NAME" --repo $GITHUB_REPOSITORY
            echo "Release $TAG_NAME created"
          else
            echo "Release $TAG_NAME already exists"
          fi

      # 8. Удаляем старый latest
      - name: Delete old latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$VERSION"
          ASSET_ID=$(gh release view $TAG_NAME --repo $GITHUB_REPOSITORY --json assets --jq '.assets[] | select(.name=="naverstay-element-plus-latest.tgz") | .id' 2>/dev/null)
          if [ -n "$ASSET_ID" ]; then
            gh release delete-asset $ASSET_ID --repo $GITHUB_REPOSITORY
            echo "Old latest deleted"
          else
            echo "No old latest found"
          fi

      # 9. Загружаем версионный архив
      - name: Upload versioned tgz
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. Загружаем latest
      - name: Upload latest tgz
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naverstay-element-plus-latest.tgz
          name: naverstay-element-plus-latest.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
