name: Build & Release element-plus latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js + pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install -g pnpm@9.5.0
          pnpm install

      # 3. Build project
      - name: Build project
        run: pnpm build

      # 4. Генерация package.publish.json
      - name: Generate minimal package.publish.json
        run: |
          node generate-package-publish.js

      # 5. Pack dist into tgz
      - name: Pack dist
        run: |
          cd dist
          npm pack
          ARCHIVE=$(ls *.tgz)
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      # 6. Copy archive as latest
      - name: Copy archive as latest
        run: |
          cp dist/$ARCHIVE dist/naverstay-element-plus-latest.tgz

      # 7. Publish release to GitHub
      - name: Publish latest release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/naverstay-element-plus-latest.tgz
          name: naverstay-element-plus-latest.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
